# Windows (win-64) environment for the launcher.
#
# linux/environment.yml is a full Linux solve - every package pinned to a linux-64
# build string, with alsa-lib, pulseaudio and libgcc in it - so it cannot solve
# on Windows at all. This file lists only what the code actually imports and
# lets conda pick the builds, which is also why it needs no maintenance when
# conda-forge rolls a build number.
#
# conda-forge ships the same GNU Radio here as on Linux (3.10.12.0, py312), so
# the flowgraphs run against the version they were written for.
#
#   conda env create -f windows\environment.yml
#   conda activate gnu
#
# The HackRF additionally needs a WinUSB driver bound to it - see
# windows\bootstrap.ps1 and the README.
name: gnu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gnuradio=3.10.12          # metapackage: core, qtgui, soapy, uhd, audio
  - soapysdr
  - soapysdr-module-hackrf    # the HackRF backend gr-soapy talks to
  - soapysdr-module-rtlsdr    # the RTL-SDR backend; it pulls rtl-sdr in with it
  - pyqt=5.15
  - numpy
  - scipy
  - pillow                    # the launcher tints its icons with PIL
  - ffmpeg                    # video clips, and MP3 audio in every app that plays a file
